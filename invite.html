<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited to LingoSphere</title>
  <style>
    :root {
      --bg: #070D1E;
      --card: #0F1A36;
      --cyan: #22D3EE;
      --blue: #3B82F6;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: #1E2F5A;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #070D1E 0%, #0A1533 100%);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 10px 0; font-size: 24px; }
    p { margin: 0 0 18px 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
    .code-box {
      display: inline-block;
      padding: 10px 18px;
      background: #142247;
      border: 1px solid var(--cyan);
      border-radius: 12px;
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      margin-top: 10px;
      font-size: 15px;
    }
    .btn-primary { background: var(--cyan); color: #04101D; }
    .btn-secondary { background: #142247; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Learn Languages Together on LingoSphere</h1>
    <p>Hey! Practice speaking with AI tutors and language partners worldwide. Join with this invitation to receive +100 Welcome XP.</p>
    <div id="codeWrap" style="display:none;">
      <div class="code-box" id="refCodeBadge"></div>
    </div>
    <a id="openAppBtn" class="btn btn-primary" href="lingosphere://invite">Open LingoSphere App</a>
    <a id="installBtn" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.aistudio.lingosphere.kxpqzm">Download on Google Play</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = (params.get("ref") || params.get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      var valid = /^[A-Z0-9]{6,16}$/.test(raw);
      if (valid) {
        document.getElementById("codeWrap").style.display = "block";
        document.getElementById("refCodeBadge").textContent = raw;
        var deepLink = "lingosphere://invite?ref=" + encodeURIComponent(raw);
        var storeLink = "https://play.google.com/store/apps/details?id=com.aistudio.lingosphere.kxpqzm&referrer=" + encodeURIComponent("ref=" + raw);
        document.getElementById("openAppBtn").href = deepLink;
        document.getElementById("installBtn").href = storeLink;
        setTimeout(function () { window.location.href = deepLink; }, 180);
      }
    })();
  </script>
</body>
</html>
